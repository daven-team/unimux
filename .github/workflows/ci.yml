name: CI

# unimux 1.2.0+: the Tauri 2 + Rust app (docs/tauri/PLAN.md U4). The job names of the three platform builds are the ones of
# 1.1.x (Windows x64, macOS Apple Silicon, macOS Intel): scripts/release.mjs waits for them and scripts/verify-release-build.mjs
# checks them before "Publish release" uses this run's artifacts. A manual run (workflow_dispatch, any branch) is a full
# rehearsal of a release: the three signed builds plus "Release assets", which assembles and verifies the exact asset list.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run. Every other run gets a group of its own (GitHub would
# otherwise cancel a pending run of the same group even without cancel-in-progress): pushes to main, tags and
# manual runs are never cancelled (the release script waits for the run on the tag, "Publish release" uses its artifacts).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99.1'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
  # npm ci runs before cargo test, so the A1 lock interop cases against the real proper-lockfile must run, never skip.
  UNIMUX_REQUIRE_LOCK_INTEROP: '1'

jobs:
  # The typecheck does not depend on the platform: it runs once, on the cheapest runner, next to the other jobs.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # No install scripts: tsc needs the packages' types only.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

  # Unit tests, generated-file drift, fmt / clippy / cargo test (debug and release rules) on both platforms, on every run:
  # a tag is only released when they passed for its commit (verify-release-build accepts no failed job).
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: checks
      - run: npm ci --no-audit --no-fund
      # Generated files must match their sources: the window.mc contract, the message table, the golden corpus.
      - run: npm run gen:check
      - run: node scripts/porting-count.mjs --check
      - name: No 3.0.0-alpha in the lockfiles
        shell: bash
        run: |
          if grep -n '3\.0\.0-alpha' src-tauri/Cargo.lock package-lock.json; then echo "::error::a 3.0.0-alpha package is in a lockfile"; exit 1; fi
      # vitest on Windows (as in tauri.yml); the Rust suites below run on both platforms.
      - run: npm test
        if: runner.os == 'Windows'
      # The renderer bundle first: tauri::generate_context! embeds out/tauri-renderer.
      - run: npm run build:ui
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets --features unimux-app/dev-overrides,unimux-app/test-bridge -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace
        working-directory: src-tauri
      # The release rules (MC_* overrides, the DevTools port and the dev server origin compiled out) are only active in
      # release builds, so they get their own clippy and tests.
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --release
        working-directory: src-tauri
      - run: cargo test --workspace --features unimux-app/dev-overrides,unimux-app/test-bridge,unimux-core/dev-overrides
        working-directory: src-tauri

  # Tag runs can only read caches saved on main, and the build jobs never run on main: without this job every release would
  # start with a cold Rust build. It fills the same cache entries as the build jobs (same shared key) with the release
  # build of each target. A failed warm-up does not turn main red: the next push tries again.
  warm-cache:
    name: Warm cache (${{ matrix.name }})
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macOS Apple Silicon, os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-15, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      # The binary only: compiling is what the cache keeps, the bundles are thrown away.
      - name: Release build (fills the cache)
        run: npx tauri build --ci --target ${{ matrix.target }} --no-bundle

  # Fails in seconds when a tag does not match the version files (package.json, Cargo.toml, Cargo.lock, tauri.conf.json)
  # or has no release notes.
  release-metadata:
    name: Release metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/check-release-tag.mjs

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: unimux.exe, artifact: windows-x64 }
          - { name: macOS Apple Silicon, os: macos-15, target: aarch64-apple-darwin, binary: unimux, artifact: macos-arm64 }
          - { name: macOS Intel, os: macos-15, target: x86_64-apple-darwin, binary: unimux, artifact: macos-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      # beforeBuildCommand builds the renderer; the bundle targets come from tauri.conf.json (NSIS) and
      # tauri.macos.conf.json (app + dmg, ad-hoc signature). The updater archive and the signatures are made below.
      - name: Package application
        run: npx tauri build --ci --target ${{ matrix.target }}
      # No Node in the shipped app (PLAN R1): no node.exe, no .node addon, no JS outside the renderer bundle.
      - name: Bundle carries no Node
        run: npm run check:bundle -- --target ${{ matrix.target }}
      - name: Release build has no dev overrides
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -f "$bin"
          # MC_DATA_DIR (the dev-overrides env reads) and test_bridge (the harness command) are in every dev-overrides /
          # test-bridge binary on every OS and absent from a release one.
          for marker in MC_DATA_DIR MC_DEBUG_PORT test_bridge; do
            if grep -a -q -- "$marker" "$bin"; then echo "::error::the release binary contains $marker"; exit 1; fi
          done
          # The DevTools switch is built only on Windows (browser_args is used inside cfg(windows)), so it is checked there.
          if [ "${{ runner.os }}" = "Windows" ] && grep -a -q -- '--remote-debugging-port' "$bin"; then
            echo "::error::the release binary contains --remote-debugging-port"; exit 1
          fi
      # Release names, the 1.1.x manifests (latest.yml / latest-mac.yml), the ditto zip, the .app.tar.gz and the minisign
      # signatures (checked against the public key the app embeds). The key exists only as these two secrets; pull requests
      # (forks get no secrets) build unsigned, tags and manual runs must sign.
      - name: Release assets of this platform
        shell: bash
        run: node scripts/release-build-assets.mjs --target ${{ matrix.target }} --out release ${{ github.event_name == 'pull_request' && '--allow-unsigned' || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 0.9.3 and 0.9.4 crashed when started from a shortcut or the installer (no console, no standard handles), which no
      # check started from a terminal could see. The release setup is installed silently into a scratch folder, the INSTALLED
      # exe is started without a console, and the 1.1.x update window's `-e` call is checked on it.
      - name: Install and start the app without a console
        if: runner.os == 'Windows'
        run: npm run test:start
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unimux-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # The publish step's checks on this run's artifacts, before anything is published: exact asset list, manifests against the
  # files, every .sig against the embedded public key, latest.json. The result is kept as `release-preview` (not matched by
  # the `unimux-*` pattern "Publish release" downloads).
  release-assets:
    name: Release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unimux-*
          path: release-assets
      - name: Verify and assemble the release assets
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/crates/unimux-app/tauri.conf.json').version")"
          node scripts/prepare-release-assets.mjs release-assets "$version" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: release-assets/publish/*
          if-no-files-found: error
          retention-days: 14
