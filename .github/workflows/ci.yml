name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run. Every other run gets a group of its own (GitHub would
# otherwise cancel a pending run of the same group even without cancel-in-progress): pushes to main, tags and
# manual runs are never cancelled (the release script waits for the run on the tag, "Publish release" uses its artifacts).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The typecheck does not depend on the platform: it runs once, on the cheapest runner, next to the other jobs.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No install scripts: tsc needs the packages' types only (no Electron binary, no native node-pty build on Linux).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

  # Pushes to main only need the fast checks; the three platform packages are built for tags, pull requests
  # and manual runs (a manual run is a full rehearsal of a release).
  quick:
    name: Checks
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  # Tag runs can only read caches saved on main, and the package jobs never run on main: without this job every
  # release started with cold Electron and electron-builder downloads. It fills the same cache entries as the package
  # jobs (same paths and key) and does the work only when Electron or electron-builder changed, otherwise it ends after the
  # cache lookup. A failed warm-up (a flaky dmg build) does not turn main red: the next push tries again.
  warm-cache:
    name: Warm cache (${{ matrix.name }})
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            download-cache: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac -- --arm64
            download-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - name: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac -- --x64
            download-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The key follows the Electron and electron-builder versions only: npm version rewrites package-lock.json on every
      # release, so a lockfile hash never matched between main and the tag pushed with it.
      - id: tools
        name: Packaging tool versions
        shell: bash
        run: echo "versions=$(node -p "const l = require('./package-lock.json').packages; ['electron', 'electron-builder', 'app-builder-lib'].map((n) => l['node_modules/' + n].version).join('-')")" >> "$GITHUB_OUTPUT"
      - id: downloads
        name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.download-cache }}
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.versions }}
      - if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.downloads.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Packaging is what downloads the Electron zip and electron-builder's tools; its output is thrown away.
      - if: steps.downloads.outputs.cache-hit != 'true'
        name: Package application (fills the download cache)
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Fails in seconds when a tag does not match package.json or has no release notes.
  release-metadata:
    name: Release metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-release-tag.mjs

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            # Where electron-builder 26 keeps the Electron zip (@electron/get, no env override) and its tools (NSIS, ...).
            download-cache: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac -- --arm64
            artifact: macos-arm64
            download-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            files: |
              release/*-mac-arm64.dmg
              release/*-mac-arm64.zip
              release/latest-mac*.yml
          - name: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac -- --x64
            artifact: macos-x64
            download-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            files: |
              release/*-mac-x64.dmg
              release/*-mac-x64.zip
              release/latest-mac*.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The key follows the Electron and electron-builder versions only: npm version rewrites package-lock.json on every
      # release, so a lockfile hash never matched between main and the tag pushed with it.
      - id: tools
        name: Packaging tool versions
        shell: bash
        run: echo "versions=$(node -p "const l = require('./package-lock.json').packages; ['electron', 'electron-builder', 'app-builder-lib'].map((n) => l['node_modules/' + n].version).join('-')")" >> "$GITHUB_OUTPUT"
      # The Electron zip and electron-builder's tools, per OS and architecture; a new Electron or electron-builder starts a
      # fresh entry, so old downloads do not pile up. Saved only after a green job.
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.download-cache }}
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.versions }}
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Unit tests stay on every platform (a macOS-only failure caught a real platform difference in 0.9.3). They run
      # before packaging, not next to it: timing-sensitive tests (git, pty) time out on a busy runner.
      - run: npm test
      - name: Package application
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged terminal runtime
        run: npm run test:packaged
      # 0.9.3 and 0.9.4 crashed when started from a shortcut or the installer (no console, no standard handles), which no
      # check started from a terminal could see.
      - name: Start the packaged app without a console
        if: runner.os == 'Windows'
        run: npm run test:start
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unimux-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
