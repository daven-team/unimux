name: Publish release

# Publishes the artifacts of a green CI run on a version tag (PLAN U4). Nothing is built or signed here: the CI run made the
# signed Tauri installers and archives; prepare-release-assets.mjs checks them again (manifests, minisign signatures against
# the embedded public key, the exact asset list) and writes latest.json, latest-mac.yml and SHA256SUMS.txt. Assets: latest.yml +
# unimux-Setup-X.exe (+ .sig), latest-mac.yml + unimux-X-mac-<arch>.zip / .dmg, unimux-X-mac-<arch>.app.tar.gz (+ .sig),
# latest.json, SHA256SUMS.txt. Published as the latest release, never as a prerelease.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.3.0)
        required: true
        type: string
      build_run_id:
        description: Successful CI run that built this tag's commit
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Verify tag and successful build
        run: node scripts/verify-release-build.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: unimux-*
          path: release-assets
      - name: Verify installers and prepare update manifests
        run: node scripts/prepare-release-assets.mjs release-assets "${RELEASE_TAG#v}" --repository "$RELEASE_REPOSITORY"
      - name: Prepare release description with download guide
        run: |
          # The download guide names the files of this release: <version> becomes the real version number.
          cat "docs/releases/${RELEASE_TAG#v}.md" docs/releases/DOWNLOADS.md | sed "s/<version>/${RELEASE_TAG#v}/g" > release-notes.md
      - name: Create draft with all platform packages
        run: |
          gh release create "$RELEASE_TAG" release-assets/publish/* \
            --repo "$RELEASE_REPOSITORY" --verify-tag --draft \
            --title "unimux ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
