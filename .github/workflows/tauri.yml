name: Tauri

# The 1.2.0 migration (docs/tauri/PLAN.md F12). Runs on the tauri-* branches only. Since U4, ci.yml builds and signs the
# release (and a manual run of ci.yml on any branch is the release rehearsal); this workflow stays the quick branch check with
# unsigned bundles.
on:
  push:
    branches: ['tauri-*', 'tauri/*']
  pull_request:
    branches: ['tauri-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99.1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
  # npm ci runs before cargo test, so the A1 lock interop cases against the real proper-lockfile must run, never skip.
  UNIMUX_REQUIRE_LOCK_INTEROP: '1'

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      # Generated files must match their sources: the window.mc contract, the message table, the golden corpus.
      - run: npm run gen:check
      - run: node scripts/porting-count.mjs --check
      - name: No 3.0.0-alpha in the lockfiles
        shell: bash
        run: |
          if grep -n '3\.0\.0-alpha' src-tauri/Cargo.lock package-lock.json; then echo "::error::a 3.0.0-alpha package is in a lockfile"; exit 1; fi
      - run: npm run typecheck
      - run: npm test
        if: runner.os == 'Windows'
      # The renderer bundle first: tauri::generate_context! embeds out/tauri-renderer.
      - run: npm run build:ui
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets --features unimux-app/dev-overrides,unimux-app/test-bridge -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace
        working-directory: src-tauri
      # B1 dual host: the existing .int suites against the Rust code through unimux-hostd (docs/tauri/HOSTD.md). The node
      # host of the same suites runs in `npm test` above.
      - name: .int suites on the Rust host (unimux-hostd)
        run: npm run test:hostd
        env:
          UNIMUX_HOST_TARGETS: rust
      # The release rules (MC_* overrides, the DevTools port and the dev server origin compiled out: `cfg(not(dev_overrides))`
      # in unimux-app, PACKAGED in unimux-core) are only active in release builds, so they get their own clippy and tests.
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --release
        working-directory: src-tauri
      - run: cargo test --workspace --features unimux-app/dev-overrides,unimux-app/test-bridge,unimux-core/dev-overrides
        working-directory: src-tauri

  build:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: unimux.exe }
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, binary: unimux }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, binary: unimux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      # Unsigned: the signed updater artifacts are made by ci.yml (scripts/release-build-assets.mjs).
      - run: npx tauri build --target ${{ matrix.target }}
      - name: Release build has no dev overrides
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -f "$bin"
          # MC_DATA_DIR (the dev-overrides env reads) and test_bridge (the harness command) are in every dev-overrides /
          # test-bridge binary on every OS and absent from a release one.
          for marker in MC_DATA_DIR MC_DEBUG_PORT test_bridge; do
            if grep -a -q -- "$marker" "$bin"; then echo "::error::the release binary contains $marker"; exit 1; fi
          done
          # The DevTools switch is built only on Windows (browser_args is used inside cfg(windows)), so it is checked there.
          if [ "${{ runner.os }}" = "Windows" ] && grep -a -q -- '--remote-debugging-port' "$bin"; then
            echo "::error::the release binary contains --remote-debugging-port"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unimux-tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  # S4 acceptance: the russh login core against real SSH servers in Docker (OpenSSH 10 with four configs, OpenSSH 5.9,
  # Dropbear 2025 and 2016; the SP7 images), compared with 1.1.4's recorded results (test/golden/sp7/matrix.json). Linux
  # only (Docker on the hosted runner); the containers are removed by id inside the script.
  ssh-matrix:
    name: SSH server matrix (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ssh-matrix
      # Only unimux-ssh and its own dependencies are built (no Tauri, no WebKitGTK).
      - run: cargo build -p unimux-ssh --example ssh_matrix
        working-directory: src-tauri
      - run: node scripts/ssh-matrix.mjs --build

  # D12 / SP9: the DB clients against real servers in Docker (Postgres 13 and 18, MySQL 8.4, MariaDB 11, Redis 8): the
  # 1.1.4 goldens through Node (test/db-wire-sp9.int.test.ts) and the Rust clients (unimux-db tests/wire_servers.rs, the
  # `#[ignore]`d server tests). Linux only (Docker on the hosted runner); the script removes its containers by id.
  db-servers:
    name: DB server matrix (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: db-servers
      - run: npm ci --no-audit --no-fund
      # Only unimux-db and its own dependencies are built (no Tauri, no WebKitGTK).
      - run: cargo build -p unimux-db --tests
        working-directory: src-tauri
      - run: node scripts/spike-db-wire.mjs

  # PLAN W2 acceptance: the check build (dev-overrides + test-bridge) boots on macOS and the WebKit shims, the app menu and
  # the text-substitution defaults are in place, checked over the eval bridge (WKWebView has no CDP). The manual items
  # (traffic lights, Cmd+V, IME, WebGL settling, App Nap) are R3's checklist.
  mac-smoke:
    name: macOS eval-bridge smoke
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target/check
          key: check
      - run: npm ci --no-audit --no-fund
      - run: npm run build:check
      - run: node scripts/smoke-eval-bridge.mjs
        timeout-minutes: 5
