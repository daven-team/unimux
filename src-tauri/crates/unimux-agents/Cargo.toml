[package]
name = "unimux-agents"
description = "hook server, Claude/Codex settings, CLI detector, context, sessions, conversation search, delivery (H1-H6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
unimux-exec.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
