[package]
name = "unimux-sftp"
description = "SFTP service, sides, queue, manage ops, sudo over exec (T1-T5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
# T1: logins through S3's LoginRegistry and the coordinator's protocol; validLocalPath from G5.
unimux-ssh.workspace = true
unimux-files.workspace = true
serde_json.workspace = true
futures.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
regex.workspace = true
russh.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "io-util", "fs"] }
tokio-util.workspace = true
uuid.workspace = true
zeroize.workspace = true
# T4: the editor stamp hash and image data URLs.
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# The in-process SSH server (the sftp subsystem over a real login).
unimux-ssh = { workspace = true, features = ["test-server"] }
