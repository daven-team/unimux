[package]
name = "unimux-db"
description = "DB service, vault, history, PG / MySQL / Redis / SQLite sessions, tunnels, result routing (D1-D12)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
unimux-state.workspace = true
unimux-oscrypt.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "fs", "io-util"] }
parking_lot.workspace = true
uuid.workspace = true
futures.workspace = true
getrandom.workspace = true
zeroize.workspace = true
bytes.workspace = true
postgres-protocol.workspace = true
# D7: client_ed25519 for MariaDB ed25519 accounts (new in 1.2.0: mysql2 has no such plugin); curve25519-dalek is already in
# the lock (russh).
mysql_common = { workspace = true, features = ["client_ed25519"] }
flate2.workspace = true
fallible-iterator.workspace = true
base64.workspace = true
ryu-js.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
# D7: the iconv-lite double-byte encodings of MySQL session charsets; TLS for MySQL (rustls, ring, like unimux-net).
encoding_rs.workspace = true
socket2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
sha2.workspace = true
serde.workspace = true
# only to show the gaps of the redis crate next to the own RESP2 reader (SP9)
redis.workspace = true
# D7: self-signed server certificates for the TLS tests of the MySQL client
rcgen.workspace = true
