[package]
name = "unimux-mcp"
description = "MCP HTTP server, tools, automation, wait_for, team prompts (M1-M4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
unimux-state.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }
parking_lot.workspace = true
uuid.workspace = true
futures.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio-util.workspace = true
getrandom.workspace = true

[features]
# The stand-in automation service of src/fake.rs (the crate's tests and the app's test-bridge check build only).
fake-automation = []

[dev-dependencies]
unimux-mcp = { path = ".", features = ["fake-automation"] }
regex.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros"] }
