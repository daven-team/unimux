[package]
name = "unimux-accounts"
description = "account stores, locks, activation/swap, reconcile/refresh, logins, usage, auto-switch, limit alerts, GitHub token (A1-A6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
uuid.workspace = true
sha2.workspace = true
getrandom.workspace = true
dunce.workspace = true
# A2: the per-profile FIFO lock (blocking and async) and the 30 s recovery retry task.
# A6 (GitHub sign-in): the token store on safeStorage, GitHub's API and device flow over http_fetch, `gh auth token`.
unimux-oscrypt.workspace = true
unimux-net.workspace = true
unimux-exec.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util.workspace = true
regex.workspace = true
url.workspace = true
zeroize.workspace = true
base64.workspace = true
# A3: Retry-After as an HTTP date.
httpdate.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "test-util"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
