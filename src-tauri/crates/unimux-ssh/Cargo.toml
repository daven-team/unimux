[package]
name = "unimux-ssh"
description = "SSH vault, known hosts, keys, russh login core, coordinator, command history (S1-S4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# S4: the in-process russh test server (`test_server`) for other crates' tests; this crate's own tests always have it.
test-server = []

[dependencies]
unimux-core.workspace = true
unimux-ipc.workspace = true
# P5: SSH shell cells are terminals of the pty output engine.
unimux-pty.workspace = true
# S1: the stores seal secrets with the app's safeStorage (B2) and share the IndexMap order of the history hosts.
unimux-oscrypt.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# S2: key reading (russh / ssh-key; ssh-key's `tdes` feature for 3des-cbc key files), the own traditional PEM reader
# (aes, cbc, ctr, des, blowfish, md5), ssh2's key regexes (regex) and the key generator (ssh-key over the OS RNG).
russh.workspace = true
ssh-key.workspace = true
aes.workspace = true
cbc.workspace = true
des.workspace = true
md5.workspace = true
ctr.workspace = true
blowfish.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
rand_core.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "net"] }
tempfile.workspace = true

[[example]]
name = "sp7_probe"
path = "examples/sp7_probe.rs"
