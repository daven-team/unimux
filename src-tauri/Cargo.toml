# unimux 1.2.0: one Rust process (Tauri 2). Every subsystem is its own crate; the member list is complete from wave 0 on,
# so later packages never edit it (see docs/tauri/ARCHITECTURE.md section 2 and PLAN.md F1).
[workspace]
resolver = "3"
members = [
  "crates/unimux-app",
  "crates/unimux-core",
  "crates/unimux-ipc",
  "crates/unimux-state",
  "crates/unimux-platform",
  "crates/unimux-exec",
  "crates/unimux-pty",
  "crates/unimux-net",
  "crates/unimux-oscrypt",
  "crates/unimux-git",
  "crates/unimux-files",
  "crates/unimux-agents",
  "crates/unimux-mcp",
  "crates/unimux-ssh",
  "crates/unimux-sftp",
  "crates/unimux-db",
  "crates/unimux-accounts",
  "crates/unimux-update",
  "crates/unimux-hostd",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["ajzak", "azozowsky"]
repository = "https://github.com/daven-team/unimux"

# One line per dependency; a package adds its own line here (merge conflicts: take the target branch and rebuild).
# Versions checked with `cargo info` on 2026-11-06. Never 3.0.0-alpha (CI greps Cargo.lock).
[workspace.dependencies]
unimux-core = { path = "crates/unimux-core" }
unimux-ipc = { path = "crates/unimux-ipc" }
unimux-state = { path = "crates/unimux-state" }
unimux-platform = { path = "crates/unimux-platform" }
unimux-exec = { path = "crates/unimux-exec" }
unimux-pty = { path = "crates/unimux-pty" }
unimux-net = { path = "crates/unimux-net" }
unimux-oscrypt = { path = "crates/unimux-oscrypt" }
unimux-git = { path = "crates/unimux-git" }
unimux-files = { path = "crates/unimux-files" }
unimux-agents = { path = "crates/unimux-agents" }
unimux-mcp = { path = "crates/unimux-mcp" }
unimux-ssh = { path = "crates/unimux-ssh" }
unimux-sftp = { path = "crates/unimux-sftp" }
unimux-db = { path = "crates/unimux-db" }
unimux-accounts = { path = "crates/unimux-accounts" }
unimux-update = { path = "crates/unimux-update" }

tauri = { version = "=2.12.5", default-features = false, features = ["wry", "common-controls-v6", "compression"] }
tauri-build = { version = "=2.7.4", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
thiserror = "2.0.21"
parking_lot = "0.13.0"
uuid = { version = "1.29.0", features = ["v4"] }
dirs = "7.0.0"
ryu-js = "1.0.3"
fs4 = { version = "1.1.0", features = ["sync"] }
interprocess = "2.4.7"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group", "kill-on-drop"] }
junction = "2.1.0"
dunce = "1.0.5"
# W3: the one-time read of 1.1.x's localStorage (Chromium leveldb, snappy tables).
rusty-leveldb = { version = "4.0.2", default-features = false, features = ["fs"] }
sha2 = "0.11.1"
base64 = "0.23.1"
futures = "0.3"
tempfile = "3"
# M1 (MCP argument checks), G1 (the JS regexes of the git module: redactSecrets, SCRUBBED_ENV; JS semantics spelled out in the
# patterns) and S2 (the ssh2 key-format regexes).
regex = "1.13.1"
windows = "0.62.2"
libc = "0.2"
webview2-com = "0.39.1"
aes-gcm = "0.11.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
zeroize = "1.9.1"
getrandom = "0.4.3"
security-framework = "3.7.0"
# macOS window chrome / App Nap / WebKit text substitutions / editing actions (W2): the versions tao and wry already use.
# W6 (macOS lifecycle: power-off notification, applicationShouldTerminate) adds its features in unimux-platform.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSProcessInfo", "NSUserDefaults", "NSObject"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard", "NSGraphics"] }
# SP7: ring backend (same provider as rustls), no aws-lc-sys build; "des" is not needed (3des-cbc is not in 1.1.4's offer).
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
# The ssh-key russh pins; "tdes" adds 3des-cbc OpenSSH key files (1.1.4 reads them). SP7.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["tdes"] }
# Legacy encrypted PEM (Proc-Type: 4,ENCRYPTED) decryption, own code (SP7 prototype, S2): AES-CBC/CTR, DES-EDE3-CBC, BF-CBC;
# the same versions russh and bcrypt-pbkdf pull in. aes and cbc are shared with unimux-oscrypt (SP2, macOS AES-128-CBC).
aes = "=0.9.4"
cbc = "=0.2.1"
des = "=0.9.0"
md5 = "=0.8.1"
ctr = "=0.10.1"
blowfish = "=0.10.0"
# S2: keys generated from the OS RNG (getrandom's SysRng through rand_core 0.10, the version ssh-key uses); the ssh2
# key-format regexes use the workspace regex (leftmost-first matching gives the same groups as the JS engine).
rand_core = "=0.10.1"
# M1 (MCP server, decided in SP8): hyper http1 served directly; axum stays for the hooks server. rmcp dropped in M1.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = "0.7.20"
postgres-protocol = "0.6.12"
mysql_common = { version = "0.38.2", default-features = false }
# dev-dependency of unimux-db only (SP9 measured its gaps; the app uses an own RESP2 client)
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp"] }
fallible-iterator = "0.2.0"
# mysql_common needs one flate2 backend: the pure Rust one (no C zlib build).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# B3 (unimux-net): an own HTTP client on hyper's connection API, because reqwest 0.13 always adds `Accept: */*` and the token
# renewal must put exactly the given headers on the wire. TLS: rustls with the ring provider and the OS trust store
# (rustls-platform-verifier, like Chromium's system verifier). rcgen only in the tests (self-signed server certificates).
http = "1.5.0"
url = "2.5.8"
tower-service = "0.3.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# W4 (notifications, dialogs, clipboard, shell): rfd is what tauri-plugin-dialog wraps (no plugin: the renderer never opens
# dialogs itself), trash is Electron's shell.trashItem, url the WHATWG parser of openExternal, objc2-* the macOS APIs.
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
trash = "5.3.0"
block2 = "0.6.2"
objc2-user-notifications = "0.3.2"
# G5: the file tree's name order (Intl.Collator('pl', {numeric, sensitivity: 'base'})) and TextDecoder's fatal decode.
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
encoding_rs = "0.8.44"
# G5: the Parquet table preview (1.1.4 hyparquet + hyparquet-compressors: snappy, gzip, brotli, zstd, lz4, lz4_raw); no arrow.
parquet = { version = "60.1.0", default-features = false, features = ["snap", "brotli", "flate2-rust_backend", "lz4", "zstd"] }
# H5 (conversation search): byte prefilters and UTF-16 substring search, the insertion-ordered index, NFD for fold().
memchr = "2.8.3"
indexmap = "2.14.2"
unicode-normalization = "0.1.26"
# H5: the index keeps its stat / read workers between passes (a thread start per pass and file was most of a rescan).
rayon-core = "1.13.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
opt-level = 3

[profile.dev]
# Keeps debug builds of the GUI responsive (xterm traffic, JSON) without slowing incremental builds much.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
