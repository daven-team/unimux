# SP7 "current": OpenSSH 10 defaults for algorithms.
Port 22
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_ecdsa384_key
HostKey /etc/ssh/ssh_host_ecdsa521_key
HostKey /etc/ssh/ssh_host_rsa_key
UsePAM yes
KbdInteractiveAuthentication yes
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no
Banner /etc/ssh/banner
LogLevel VERBOSE
# OpenSSH 9.8+ penalizes a source after failed key exchanges and refuses it for a while: off for the matrix.
PerSourcePenalties no
Subsystem sftp internal-sftp
Match User kbd
  AuthenticationMethods keyboard-interactive
