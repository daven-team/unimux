# SP7 "old": the offer of an OpenSSH 5.3 to 6.4 server (CentOS 6, Ubuntu 12.04 era) rebuilt on OpenSSH 10:
# no curve25519/ecdh, gex-sha256 plus the SHA-1 kex, only the ssh-rsa host key, SHA-1/MD5 MACs, CTR and CBC ciphers.
Port 22
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa
KexAlgorithms diffie-hellman-group-exchange-sha256,diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
Ciphers aes128-ctr,aes192-ctr,aes256-ctr,aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc
MACs hmac-md5,hmac-sha1,hmac-sha1-96,hmac-md5-96
PubkeyAcceptedAlgorithms ssh-rsa,rsa-sha2-256,rsa-sha2-512
UsePAM yes
KbdInteractiveAuthentication yes
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no
LogLevel VERBOSE
# OpenSSH 9.8+ penalizes a source after failed key exchanges and refuses it for a while: off for the matrix.
PerSourcePenalties no
Subsystem sftp internal-sftp
Match User kbd
  AuthenticationMethods keyboard-interactive
