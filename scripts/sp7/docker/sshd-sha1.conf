# SP7 "sha1": SHA-1 only (kex, host key signature, user key signature, MAC); CTR ciphers.
Port 22
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa
KexAlgorithms diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1
Ciphers aes128-ctr,aes192-ctr,aes256-ctr
MACs hmac-sha1
PubkeyAcceptedAlgorithms ssh-rsa
UsePAM yes
KbdInteractiveAuthentication yes
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no
LogLevel VERBOSE
# OpenSSH 9.8+ penalizes a source after failed key exchanges and refuses it for a while: off for the matrix.
PerSourcePenalties no
Subsystem sftp internal-sftp
Match User kbd
  AuthenticationMethods keyboard-interactive
